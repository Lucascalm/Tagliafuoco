[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tagliafuoco"
version = "0.1.0"
description = "Simulatore di supporto alle decisioni per l'impiego dei mezzi antincendio in Calabria"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tagliafuoco" }]
keywords = ["wildfire", "cp-sat", "constraint-programming", "nasa-firms", "llm"]

dependencies = [
    "ortools==9.11.4210",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.0.2",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
tagliafuoco = "tagliafuoco.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not network and not llm'"
markers = [
    "network: richiede accesso a internet (escluso di default)",
    "llm: richiede ANTHROPIC_API_KEY (escluso di default)",
    "slow: test lento, utile in locale ma escluso dalla verifica rapida",
]

[tool.coverage.run]
source = ["src/tagliafuoco"]
omit = ["*/__init__.py"]
