name: verifica

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test su ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Installa il pacchetto e le dipendenze di sviluppo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verifica i confini architetturali
        run: python scripts/verifica_architettura.py

      - name: Test
        run: python -m pytest -q --cov --cov-report=term-missing

      - name: Controlla che i dati statici siano allineati al generatore
        run: python scripts/genera_dati_statici.py --check
        continue-on-error: true
